<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Proyek - Modul 4</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 30px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
            overflow-wrap: anywhere;
        }

        .form-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-section h2,
        .list-heading {
            color: #1e3a8a;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input:not([type="checkbox"]),
        .form-group select,
        #search-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #ffffff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 14px;
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 9px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-add {
            background: #1e3a8a;
            color: white;
            width: 100%;
            padding: 11px;
        }

        .btn-filter {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-filter.active,
        .btn-filter:hover {
            background: #1e3a8a;
            color: #ffffff;
            border-color: #1e3a8a;
        }

        .search-section {
            margin-bottom: 15px;
        }

        .search-section label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .project-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #ffffff;
        }

        .project-info {
            min-width: 0;
        }

        .project-info h4 {
            font-size: 16px;
            overflow-wrap: anywhere;
            margin: 5px 0;
        }

        .project-category {
            display: inline-block;
            font-size: 12px;
            color: #0284c7;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .project-budget {
            font-size: 14px;
            color: #334155;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .project-actions {
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex-shrink: 0;
        }

        .btn-status {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }

            .project-card {
                align-items: flex-start;
            }

            .project-actions {
                max-width: 115px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Portofolio Proyek</h1>
        <p class="subtitle">
            Modul 4: Pengolahan Logika Data & Interaktivitas DOM
        </p>

        <!-- Statistik Proyek -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>

            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </div>

        <!-- Form Input Proyek -->
        <section class="form-section">
            <h2>Tambah Proyek Baru</h2>

            <form id="project-form">
                <div class="form-group">
                    <label for="project-title">Judul Proyek</label>
                    <input
                        type="text"
                        id="project-title"
                        placeholder="Masukkan judul proyek"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="project-category">Kategori</label>
                    <select id="project-category" required>
                        <option value="Web App">Web App</option>
                        <option value="Mobile App">Mobile App</option>
                        <option value="Desktop App">Desktop App</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="project-budget">Estimasi Anggaran (Rp)</label>
                    <input
                        type="number"
                        id="project-budget"
                        placeholder="Contoh: 2500000"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" id="project-completed">
                    Sudah Selesai
                </label>

                <button type="submit" class="btn btn-add">
                    + Tambah Proyek
                </button>
            </form>
        </section>

        <!-- Pencarian -->
        <div class="search-section">
            <label for="search-input">Cari Proyek</label>
            <input
                type="text"
                id="search-input"
                placeholder="Ketik nama proyek..."
            >
        </div>

        <!-- Filter Kategori -->
        <div class="filter-group">
            <button class="btn-filter active" data-category="Semua">
                Semua Proyek
            </button>
            <button class="btn-filter" data-category="Web App">
                Web App
            </button>
            <button class="btn-filter" data-category="Desktop App">
                Desktop App
            </button>
            <button class="btn-filter" data-category="Mobile App">
                Mobile App
            </button>
            <button class="btn-filter" data-category="UI/UX Design">
                UI/UX Design
            </button>
        </div>

        <h2 class="list-heading">Daftar Proyek</h2>
        <div id="project-list"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
